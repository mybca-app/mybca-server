services:
  server:
    build:
      context: .
      dockerfile: MyBCA.Server/Dockerfile
    container_name: mybca-server
    depends_on:
      - mysql
    environment:
      - SERVER_APP_PORT=${SERVER_APP_PORT:-8080}
      - TZ=${TZ:-America/New_York}
      - GOOGLE_APPLICATION_CREDENTIALS=/app/secrets/firebase-service-account.json
      - ConnectionStrings__MySql=server=mysql;port=3306;database=${MYSQL_DATABASE:-mybca};user=${MYSQL_USER:-mybca};password=${MYSQL_PASSWORD:-password}
    volumes:
      - ./secrets/firebase-service-account.json:/app/secrets/firebase-service-account.json:ro
    ports:
      - "${SERVER_APP_PORT}:8080"
    expose:
      - "5050"
    networks:
      - monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    environment:
      - TZ=${TZ:-}
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    expose:
      - "9090"
    networks:
      - monitoring
    depends_on:
      - server
  mysql:
    image: mysql:8.0
    container_name: mybca-mysql
    restart: always
    environment:
      - MYSQL_DATABASE=${MYSQL_DATABASE:-mybca}
      - MYSQL_USER=${MYSQL_USER:-mybca}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-password}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-rootpassword}
      - GRAFANA_DB_PASSWORD=${GRAFANA_DB_PASSWORD:-grafanapassword}
    expose:
      - "3306"
    networks:
      - monitoring
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db_scripts:/docker-entrypoint-initdb.d
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "${GRAFANA_PORT}:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:-admin}
      - TZ=${TZ:-}
      - GRAFANA_DB_PASSWORD=${GRAFANA_DB_PASSWORD:-grafanapassword}
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
    networks:
      - monitoring
    depends_on:
      - prometheus
      - mysql

networks:
  monitoring:
    driver: bridge

volumes:
  prometheus_data:
  mysql_data: